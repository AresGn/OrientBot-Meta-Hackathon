name: no-ai-attribution

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  no-ai-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # AGENTS.md (Git): no coding-agent attribution in commits or PRs.
      - name: Check commit messages and authors
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          agents='anthropic|claude|cursor|copilot|codex|openai|devin|windsurf|codeium|aider|gemini'
          bad=$(git log --format='%H%x09%an <%ae>%x09%B%x00' "$range" | tr '\0' '\n' | grep -iE "co-authored-by:.*($agents)|generated with \[?($agents)|claude-session:|<noreply@anthropic\.com>|cursoragent@" || true)
          if [ -n "$bad" ]; then
            echo "::error::AI coding-agent attribution found (see AGENTS.md, section Git):"
            echo "$bad"
            exit 1
          fi
          echo "No AI attribution in $range"
      - name: Check pull request description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -iqE 'generated with \[?(claude|cursor|copilot|codex)|co-authored-by:.*(claude|cursor|copilot|codex|anthropic)|claude\.ai/code'; then
            echo "::error::AI attribution found in the PR description (see AGENTS.md, section Git)."
            exit 1
          fi
          echo "PR description is clean"
